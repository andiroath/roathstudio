<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guion TikTok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDEFF3;--surface:#FFFFFF;--ink:#171A21;--muted:#5C6473;--line:#D5D9E2;
  --accent:#2A4BFF;--ok:#14804F;--warn:#A86A00;--over:#C8283A;--track:#E3E6EC;
  --head:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#13151B;--surface:#1C1F27;--ink:#ECEEF3;--muted:#9AA2B1;--line:#2D323D;--accent:#7C93FF;--ok:#4FCB8E;--warn:#E9B04A;--over:#FF6B7A;--track:#2A2E38;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#13151B;--surface:#1C1F27;--ink:#ECEEF3;--muted:#9AA2B1;--line:#2D323D;--accent:#7C93FF;--ok:#4FCB8E;--warn:#E9B04A;--over:#FF6B7A;--track:#2A2E38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 clamp(26px,5vw,36px)/1.1 var(--head);margin:0 0 14px;letter-spacing:-.01em}
.top{display:grid;gap:12px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{width:70px;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.small{font-size:14px;color:var(--muted)}
.timeline{display:flex;gap:3px;height:34px}
.seg{border-radius:6px;background:var(--track);position:relative;overflow:hidden;min-width:0}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ok);opacity:.85;transition:width .15s}
.seg.warn i{background:var(--warn)}.seg.over i{background:var(--over)}
.seg span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px;border-left:5px solid var(--ok)}
.block.warn{border-left-color:var(--warn)}.block.over{border-left-color:var(--over)}
.bh{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bh .nm{flex:1 1 160px;width:auto;font:700 18px var(--head)}
.tm{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.x{padding:6px 11px;font-size:18px;line-height:1;color:var(--muted)}
textarea{min-height:92px;resize:vertical;line-height:1.5;padding:10px 12px}
.stat{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg{font-weight:700}
.ok .msg{color:var(--ok)}.warn .msg{color:var(--warn)}.over .msg{color:var(--over)}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.warn .bar i{background:var(--warn)}.over .bar i{background:var(--over)}
button{font:700 15px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#10131A}}
:root[data-theme="dark"] button.primary{color:#10131A}
button:active{transform:translateY(1px)}
.add{width:100%;border-style:dashed;margin-bottom:18px;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#note{font-size:14px;color:var(--muted);min-height:20px}
</style>
</head>
<body>
<main>
  <h1>Guion TikTok</h1>
  <div class="top">
    <input type="text" id="title" placeholder="Nombre del video" aria-label="Nombre del video" maxlength="80">
    <div class="row">
      <label class="small" for="pace">Ritmo al hablar (palabras por segundo)</label>
      <input type="number" id="pace" min="1" max="5" step="0.1" value="2.5">
    </div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>
    <div id="total"></div>
  </div>
  <div id="blocks"></div>
  <button class="add" id="add">+ Agregar bloque</button>
  <div class="actions">
    <button class="primary" id="save">Guardar .txt</button>
    <button id="copy">Copiar guion</button>
    <button id="clear">Vaciar textos</button>
    <span id="note" role="status"></span>
  </div>
</main>
<script>
var KEY="guion-tiktok-v2";
var DEFAULTS=[["Hook",0,3],["Desarrollo",3,10],["Pregunta",10,13],["Desarrollo",13,23]];
var blocks=DEFAULTS.map(function(d){return{name:d[0],from:d[1],to:d[2],text:""}});
var clearArmed=false;
var list=document.getElementById("blocks"),tl=document.getElementById("timeline");

function pad(n){return (n<10?"0":"")+n}
function range(b){return pad(b.from)+"´´ a "+pad(b.to)+"´´"}
function words(t){var m=t.trim();return m?m.split(/\s+/).length:0}
function pace(){var p=parseFloat(document.getElementById("pace").value);return p>0?p:2.5}
function fmt(n){return (Math.round(n*10)/10).toString().replace(".",",")}
function num(v){var n=parseInt(v,10);return n>=0?n:0}

function render(){
  list.innerHTML="";tl.innerHTML="";
  blocks.forEach(function(b,i){
    var d=document.createElement("section");d.className="block ok";
    d.innerHTML='<div class="bh"><input type="text" class="nm" maxlength="40" aria-label="Nombre del bloque">'+
      '<div class="tm">de <input type="number" class="f" min="0" step="1" aria-label="Segundo de inicio"> a <input type="number" class="t" min="0" step="1" aria-label="Segundo de fin"> s</div>'+
      '<button class="x" aria-label="Eliminar bloque" title="Eliminar bloque">×</button></div>'+
      '<textarea placeholder="Escribí acá lo que decís en este bloque"></textarea>'+
      '<div class="stat"><span class="cnt"></span><span class="msg"></span></div><div class="bar"><i></i></div>';
    var nm=d.querySelector(".nm"),f=d.querySelector(".f"),t=d.querySelector(".t"),ta=d.querySelector("textarea");
    nm.value=b.name;f.value=b.from;t.value=b.to;ta.value=b.text;
    ta.setAttribute("aria-label","Texto del bloque "+(i+1));
    nm.addEventListener("input",function(){b.name=nm.value;update();persist()});
    f.addEventListener("input",function(){b.from=num(f.value);update();persist()});
    t.addEventListener("input",function(){b.to=num(t.value);update();persist()});
    ta.addEventListener("input",function(){b.text=ta.value;update();persist()});
    d.querySelector(".x").addEventListener("click",function(){
      if(blocks.length<2){note("Tiene que quedar al menos un bloque.");return}
      blocks.splice(i,1);render();update();persist();
    });
    list.appendChild(d);
    var g=document.createElement("div");g.className="seg";g.innerHTML="<i></i><span></span>";
    tl.appendChild(g);
  });
}

function state(est,dur){return dur<=0||est>dur+0.05?"over":(est>dur*0.9?"warn":"ok")}

function update(){
  var p=pace(),totW=0,totE=0,totD=0,anyOver=false;
  blocks.forEach(function(b,i){
    var dur=b.to-b.from,w=words(b.text),est=w/p,st=state(est,dur),max=Math.max(0,Math.floor(dur*p));
    totW+=w;totE+=est;if(dur>0)totD+=dur;if(st==="over")anyOver=true;
    var n=list.children[i],g=tl.children[i];
    n.className="block "+st;
    n.querySelector(".cnt").textContent=w+" palabras · ~"+fmt(est)+" s de "+Math.max(0,dur)+" s";
    var m=n.querySelector(".msg");
    if(dur<=0)m.textContent="El fin tiene que ser mayor que el inicio";
    else if(w===0)m.textContent="Máximo ~"+max+" palabras";
    else if(st==="over")m.textContent="Te pasaste ~"+fmt(est-dur)+" s · sacá "+Math.max(1,w-max)+" palabras";
    else if(st==="warn")m.textContent="Justo, te quedan ~"+Math.max(0,max-w)+" palabras";
    else m.textContent="Entra bien · te quedan ~"+(max-w)+" palabras";
    var pc=dur>0?Math.min(100,est/dur*100):0;
    n.querySelector(".bar i").style.width=pc+"%";
    g.className="seg "+(st==="ok"?"":st);g.style.flex=Math.max(dur,0.5)+" 1 0";
    g.querySelector("i").style.width=pc+"%";
    g.querySelector("span").textContent=b.name||"Bloque "+(i+1);
  });
  document.getElementById("total").innerHTML="Total: <b>"+totW+" palabras</b> · ~"+fmt(totE)+" s de "+totD+" s"+(anyOver?" · hay bloques que se pasan":"");
}

function build(){
  var p=pace(),title=document.getElementById("title").value.trim(),out=[],tw=0;
  if(title)out.push(title.toUpperCase(),"");
  blocks.forEach(function(b,i){
    out.push((b.name||"Bloque "+(i+1))+" - "+range(b));
    out.push(b.text.trim(),"");tw+=words(b.text);
  });
  out.push("Total: "+tw+" palabras · ~"+fmt(tw/p)+" s (ritmo "+fmt(p)+" palabras/s)");
  return out.join("\n")+"\n";
}

function note(m){var n=document.getElementById("note");n.textContent=m;clearTimeout(note.t);note.t=setTimeout(function(){n.textContent=""},4000)}
function fname(){
  var t=document.getElementById("title").value.trim()||"guion-tiktok";
  t=t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"guion-tiktok";
  return t+".txt";
}

document.getElementById("add").addEventListener("click",function(){
  var last=blocks[blocks.length-1],s=last?last.to:0;
  blocks.push({name:"Nuevo bloque",from:s,to:s+5,text:""});
  render();update();persist();
  var inp=list.lastChild.querySelector(".nm");inp.focus();inp.select();
});
document.getElementById("save").addEventListener("click",function(){
  try{
    var blob=new Blob([build()],{type:"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=fname();document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},500);
    note("Guardado en tu carpeta de descargas.");
  }catch(e){note("No se pudo guardar. Usá Copiar guion.")}
});
document.getElementById("copy").addEventListener("click",function(){
  try{navigator.clipboard.writeText(build()).then(function(){note("Guion copiado.")},function(){note("No se pudo copiar.")})}
  catch(e){note("No se pudo copiar.")}
});
var clr=document.getElementById("clear");
clr.addEventListener("click",function(){
  if(!clearArmed){clearArmed=true;clr.textContent="¿Seguro? Tocá de nuevo";setTimeout(function(){clearArmed=false;clr.textContent="Vaciar textos"},3000);return}
  clearArmed=false;clr.textContent="Vaciar textos";
  blocks.forEach(function(b){b.text=""});
  render();update();persist();
});
document.getElementById("pace").addEventListener("input",function(){update();persist()});
document.getElementById("title").addEventListener("input",persist);

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({blocks:blocks,title:document.getElementById("title").value,pace:document.getElementById("pace").value}))}catch(e){}
}
(function restore(){
  try{
    var r=localStorage.getItem(KEY),o;
    if(r){
      o=JSON.parse(r);
      if(o.blocks&&o.blocks.length)blocks=o.blocks.map(function(b){return{name:String(b.name||""),from:num(b.from),to:num(b.to),text:String(b.text||"")}});
      if(o.title)document.getElementById("title").value=o.title;
      if(o.pace)document.getElementById("pace").value=o.pace;
    }else{
      var old=localStorage.getItem("guion-tiktok-v1");
      if(old){o=JSON.parse(old);
        if(o.texts&&o.texts.length===blocks.length)blocks.forEach(function(b,i){b.text=o.texts[i]||""});
        if(o.title)document.getElementById("title").value=o.title;
        if(o.pace)document.getElementById("pace").value=o.pace;}
    }
  }catch(e){}
})();
render();update();
</script>
</body>
</html>
